exec-once=sh -c 'systemctl --user is-active --quiet cliphist.service || { pgrep -u "$(id -u)" -f "[w]l-paste --.*watch cliphist store" >/dev/null || exec wl-paste --watch cliphist store; }'
exec-once=sh -c 'pgrep -u "$(id -u)" -f "$HOME/.local/bin/[b]attery-guardian" >/dev/null || exec bash "$HOME/.config/mango/scripts/battery-guardian.sh"'
exec-once=sh -c 'pgrep -u "$(id -u)" -x swaybg >/dev/null || { wall="$HOME/.config/mango/current-wallpaper"; [ -f "$wall" ] || wall="$HOME/.config/mango/wallpapers/default.png"; exec swaybg -i "$wall" -m fill -c 191724; }'
exec-once=sh -c 'pgrep -u "$(id -u)" -x waybar >/dev/null || exec waybar -c "$HOME/.config/mango/waybar.jsonc" -s "$HOME/.config/mango/themes/waybar.css"'
exec-once=sh -c 'systemctl --user is-active --quiet swaync.service || { pgrep -u "$(id -u)" -x swaync >/dev/null || exec swaync -c "$HOME/.config/mango/themes/swaync/config.json" -s "$HOME/.config/mango/themes/swaync/style.css"; }'
