exec-once=sh -c 'systemctl --user is-active --quiet cliphist.service || { pgrep -u "$(id -u)" -f "[w]l-paste --.*watch cliphist store" >/dev/null || exec wl-paste --watch cliphist store; }'
exec-once=sh -c 'pgrep -u "$(id -u)" -f "$HOME/.local/bin/[b]attery-guardian" >/dev/null || exec "$HOME/.local/bin/battery-guardian"'
exec-once=sh -c 'pgrep -u "$(id -u)" -x swaybg >/dev/null || { wall="$HOME/.config/mango/current-wallpaper"; [ -f "$wall" ] || wall="$HOME/.config/hypr/current-wallpaper"; exec swaybg -i "$wall" -m fill -c 191724; }'
exec-once=sh -c 'pgrep -u "$(id -u)" -x waybar >/dev/null || exec waybar -c "$HOME/.config/mango/waybar.jsonc" -s "$HOME/.config/waybar/style.css"'
