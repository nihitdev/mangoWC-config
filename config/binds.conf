bind=ALT,z,spawn,sh -c '"$HOME/.config/mango/scripts/screenshot.sh" region'
bind=NONE,Print,spawn,sh -c '"$HOME/.config/mango/scripts/screenshot.sh" region'
bind=SHIFT,Print,spawn,sh -c '"$HOME/.config/mango/scripts/screenshot.sh" full'

bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bindrl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindrl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindrl=NONE,XF86AudioNext,spawn,playerctl next
bindrl=NONE,XF86AudioPrev,spawn,playerctl previous
bindrls=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindrls=NONE,XF86AudioPause,spawn,playerctl play-pause

bind=SUPER+ALT,space,spawn,sh -c 'bash "$HOME/.config/mango/scripts/wallpaper-picker.sh"'
bind=SUPER+ALT,l,spawn,sh -c 'bash "$HOME/.config/mango/scripts/lock.sh"'

